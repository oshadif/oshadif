<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">Oshadi Fernando developer banner</title>
<desc id="desc">Dark purple developer workspace with a cartoon girl coding on a laptop.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070912"/>
    <stop offset="0.55" stop-color="#101126"/>
    <stop offset="1" stop-color="#170b2d"/>
  </linearGradient>
  <linearGradient id="desk" x1="0" x2="1">
    <stop offset="0" stop-color="#171927"/>
    <stop offset="1" stop-color="#242039"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#34384f"/>
    <stop offset="1" stop-color="#171a29"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1280" height="400" rx="24" fill="url(#bg)"/>
<circle cx="1045" cy="85" r="170" fill="#6d28d9" opacity=".08"/>
<circle cx="730" cy="150" r="145" fill="#8b5cf6" opacity=".07"/>
<g opacity=".55" stroke="#8b5cf6" fill="none">
  <path d="M58 92l20-20m-20 20l20 20m28-40l20 20-20 20" stroke-width="5"/>
  <path d="M1082 64h48m-24-24v48" stroke-width="3"/>
  <path d="M1168 155l8 15 15 8-15 8-8 15-8-15-15-8 15-8z"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="70" y="116" fill="#f8fafc" font-size="45" font-weight="800">Code. Build. Deploy.</text>
  <text x="70" y="164" fill="#c4b5fd" font-size="23" font-weight="600">Turning ideas into powerful digital solutions.</text>
  <text x="70" y="220" fill="#94a3b8" font-size="18">FULL-STACK • MOBILE • AI/ML • CLOUD</text>
  <g transform="translate(70 258)">
    <rect width="118" height="38" rx="19" fill="#1d2435" stroke="#5b5f80"/><text x="59" y="25" text-anchor="middle" fill="#61dafb" font-size="15" font-weight="700">React</text>
    <rect x="130" width="118" height="38" rx="19" fill="#1d2435" stroke="#5b5f80"/><text x="189" y="25" text-anchor="middle" fill="#86efac" font-size="15" font-weight="700">Node.js</text>
    <rect x="260" width="138" height="38" rx="19" fill="#1d2435" stroke="#5b5f80"/><text x="329" y="25" text-anchor="middle" fill="#93c5fd" font-size="15" font-weight="700">PostgreSQL</text>
    <rect x="410" width="110" height="38" rx="19" fill="#1d2435" stroke="#5b5f80"/><text x="465" y="25" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="700">Docker</text>
  </g>
</g>
<g transform="translate(635 32)">
  <rect x="0" y="280" width="560" height="42" rx="10" fill="url(#desk)"/>
  <rect x="410" y="90" width="12" height="166" rx="6" fill="#26293a"/>
  <path d="M416 97l-62 28" stroke="#34384b" stroke-width="12" stroke-linecap="round"/>
  <path d="M350 115q-35 15-38 47h76q-3-34-38-47z" fill="#232634"/>
  <ellipse cx="350" cy="160" rx="42" ry="11" fill="#f6c978" opacity=".55" filter="url(#glow)"/>
  <rect x="460" y="235" width="48" height="48" rx="5" fill="#151a23"/><path d="M484 235v-22" stroke="#5aa469" stroke-width="6"/><path d="M484 222q-27-22-38-5 22 19 38 12m0-4q23-26 40-8-19 20-40 14" fill="#4b9660"/>
  <!-- chair -->
  <path d="M175 150q-38 55-25 139h156q13-85-25-139z" fill="#161927" stroke="#2d3146" stroke-width="4"/>
  <!-- hair -->
  <circle cx="238" cy="87" r="48" fill="#21151c"/>
  <circle cx="245" cy="48" r="29" fill="#21151c"/>
  <circle cx="266" cy="62" r="24" fill="#21151c"/>
  <!-- face -->
  <ellipse cx="240" cy="103" rx="40" ry="45" fill="#d99b72"/>
  <path d="M202 97q12-52 62-39 26 9 22 49-20-30-65-22z" fill="#21151c"/>
  <ellipse cx="227" cy="104" rx="5" ry="7" fill="#17151a"/><ellipse cx="257" cy="104" rx="5" ry="7" fill="#17151a"/>
  <path d="M231 124q11 8 23 0" fill="none" stroke="#8f4d4d" stroke-width="3" stroke-linecap="round"/>
  <!-- hoodie/body -->
  <path d="M187 154q52-37 103 0l28 115H161z" fill="#11131b" stroke="#2c3041" stroke-width="4"/>
  <path d="M210 151l29 31 29-31" fill="none" stroke="#34384c" stroke-width="4"/>
  <!-- arms -->
  <path d="M183 188q-36 47 2 80l67-4" fill="none" stroke="#11131b" stroke-width="29" stroke-linecap="round"/>
  <path d="M292 188q35 45-3 77l-63-1" fill="none" stroke="#11131b" stroke-width="29" stroke-linecap="round"/>
  <circle cx="208" cy="264" r="13" fill="#d99b72"/><circle cx="272" cy="264" r="13" fill="#d99b72"/>
  <!-- laptop -->
  <path d="M142 176h181l-18 92H160z" fill="url(#screen)" stroke="#555a73" stroke-width="3"/>
  <rect x="128" y="268" width="212" height="12" rx="6" fill="#44495e"/>
  <circle cx="231" cy="221" r="17" fill="#f8fafc"/>
  <path d="M221 219c0-8 20-8 20 0 0 7-4 10-10 10s-10-3-10-10z" fill="#14151c"/>
  <text x="177" y="215" fill="#f7df1e" font-family="Arial" font-size="15" font-weight="700">JS</text>
  <text x="280" y="215" fill="#61dafb" font-family="Arial" font-size="13" font-weight="700">⚛</text>
  <!-- coffee -->
  <rect x="77" y="248" width="52" height="38" rx="7" fill="#242737" stroke="#525873"/><path d="M129 256q25 0 15 18-6 9-15 4" fill="none" stroke="#525873" stroke-width="5"/>
  <path d="M92 241q-6-12 3-20m13 20q-6-12 3-20" fill="none" stroke="#6b7280" stroke-width="3" opacity=".6"/>
  <!-- neon note -->
  <g filter="url(#glow)" font-family="Inter,Segoe UI,Arial" fill="#c084fc">
    <text x="458" y="78" font-size="17" font-weight="700">PLAN</text><text x="458" y="101" font-size="17" font-weight="700">CODE</text><text x="458" y="124" font-size="17" font-weight="700">TEST</text><text x="458" y="147" font-size="17" font-weight="700">SHIP</text>
  </g>
</g>
<rect x="1" y="1" width="1278" height="398" rx="23" fill="none" stroke="#34365a"/>
</svg>